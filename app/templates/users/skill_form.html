{% extends "base.html" %}

{% block title %}{{ 'Edytuj' if skill else 'Nowa' }} umiejętność - KIT{% endblock %}

{% block content %}
<div class="skill-form">
    <div class="card">
        <div class="card-header">
            <h2 class="card-title">{{ 'Edytuj umiejętność' if skill else 'Nowa umiejętność' }}</h2>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('users.create_skill') if not skill else url_for('users.edit_skill', skill_id=skill.id) }}">
                <div class="form-group">
                    <label class="form-label" for="name">Nazwa umiejętności *</label>
                    <input type="text" name="name" id="name" class="form-control" value="{{ skill.name if skill else '' }}" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="category">Kategoria</label>
                    <select name="category" id="category" class="form-control">
                        <option value="">-- Wybierz kategorię --</option>
                        <option value="technical" {% if skill and skill.category == 'technical' %}selected{% endif %}>Techniczna</option>
                        <option value="design" {% if skill and skill.category == 'design' %}selected{% endif %}>Projektowanie</option>
                        <option value="management" {% if skill and skill.category == 'management' %}selected{% endif %}>Zarządzanie</option>
                        <option value="documentation" {% if skill and skill.category == 'documentation' %}selected{% endif %}>Dokumentacja</option>
                        <option value="other" {% if skill and skill.category == 'other' %}selected{% endif %}>Inna</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="description">Opis</label>
                    <textarea name="description" id="description" class="form-control" rows="3">{{ skill.description if skill else '' }}</textarea>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-primary">{{ 'Zapisz zmiany' if skill else 'Dodaj umiejętność' }}</button>
                    <a href="{{ url_for('users.list_skills') }}" class="btn btn-secondary">Anuluj</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
